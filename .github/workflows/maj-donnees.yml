name: Mise à jour des pannes opérateurs

on:
  schedule:
    # Toutes les 3 heures (heure UTC) : les opérateurs publient ~2 fois/jour,
    # on passe plus souvent pour récupérer chaque mise à jour rapidement.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}   # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Télécharger les 4 fichiers CSV
        run: |
          mkdir -p data
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          get() {
            # $1 = nom local, $2 = URL. En cas d'échec on garde l'ancien fichier.
            if curl -fsSL --retry 3 --retry-delay 10 -m 60 -A "$UA" -o "data/$1.tmp" "$2" && [ -s "data/$1.tmp" ]; then
              mv "data/$1.tmp" "data/$1.csv"; echo "\"$1\":true"
            else
              rm -f "data/$1.tmp"; echo "::warning::Échec téléchargement $1"; echo "\"$1\":false"
            fi
          }
          R1=$(get orange   "https://couverture-mobile.orange.fr/mapV3/siteshs/data/Liste_des_antennes_provisoirement_hors_service.csv" | tail -1)
          R2=$(get sfr      "https://static.s-sfr.fr/media/export-arcep/siteshorsservices.csv" | tail -1)
          R3=$(get free     "https://mobile.free.fr/account/antennes-relais-indisponibles.csv" | tail -1)
          R4=$(get bouygues "https://www.bouyguestelecom.fr/static/com/assets/reseau/siteshs/downloads/antennesindisponibles.csv" | tail -1)
          echo "{\"updated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"sources\":{$R1,$R2,$R3,$R4}}" > data/meta.json
          cat data/meta.json

      - name: Postes électriques HT (OpenStreetMap, seulement au lancement manuel ou si absent)
        continue-on-error: true
        run: |
          F=data/postes-ht.geojson
          if [ -f "$F" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Postes déjà présents : mise à jour uniquement via « Run workflow »."; exit 0
          fi
          rm -f osm_*.json; i=0
          for LAT in "41,44" "44,46" "46,48.5" "48.5,51.5"; do for LON in "-5.5,0.5" "0.5,5" "5,10"; do
            i=$((i+1)); S=${LAT%,*}; N=${LAT#*,}; W=${LON%,*}; E=${LON#*,}
            Q="[out:json][timeout:90];nwr[\"power\"=\"substation\"][\"voltage\"~\"(^|;)(63|90|150|225|400)000\"]($S,$W,$N,$E);out center tags;"
            for M in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              if curl -fsSL -m 150 --data-urlencode "data=$Q" "$M" -o "osm_$i.json"; then echo "zone $i OK"; break; fi
              rm -f "osm_$i.json"; echo "zone $i échec sur $M"; sleep 15
            done
          done; done
          python3 - <<'PY'
          import json, glob
          feats=[]; seen=set(); zones=0
          for f in glob.glob('osm_*.json'):
              try: els=json.load(open(f)).get('elements',[]); zones+=1
              except Exception as x: print('ignoré',f,x); continue
              for e in els:
                  k=f"{e['type']}/{e['id']}"
                  if k in seen: continue
                  seen.add(k)
                  lat=e.get('lat', e.get('center',{}).get('lat')); lon=e.get('lon', e.get('center',{}).get('lon'))
                  if lat is None: continue
                  t=dict(e.get('tags',{})); t['osm']=k
                  feats.append({'type':'Feature','geometry':{'type':'Point','coordinates':[round(lon,5),round(lat,5)]},'properties':t})
          print(len(feats),'postes,',zones,'zones sur 12')
          if zones==12 and len(feats)>1500:
              json.dump({'type':'FeatureCollection','features':feats},open('data/postes-ht.geojson','w'),ensure_ascii=False,separators=(',',':'))
          PY
          rm -f osm_*.json

      - name: Enregistrer si les données ont changé
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet -- ':!data/meta.json'; then
            echo "Aucun changement dans les données."
          else
            git commit -m "Données pannes : $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
